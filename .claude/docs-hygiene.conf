# doc-hygiene（update-docs スキルの衛生ゲート）の宣言的設定。
# 探索でなく宣言にすることで「毎セッション、置き場をゼロから再導出する」のをやめる。
#
# このファイルの存在自体が SessionStart フックの門番になっている。
# 無いとフックが no-op になり、memlink.sh によるメモリ symlink の自動確立が発火しない。
# 2 Mac 運用でメモリが静かに分裂する事故を防ぐため、置いておくこと自体に意味がある。
# 詳細は memory/two-mac-memory-slug.md を参照。
#
# しきい値は既定（MEMORY 25KiB / CLAUDE 15KiB / 索引行 600B / 陳腐化 180 日）のまま。
# **予算を上げて黙らせない**（それは肥大の追認）。
# 2026-08-07 時点で MEMORY.md 4% / CLAUDE.md 38% と余裕がある。

# メモリ実体（SSD 上・2 Mac 共有。~/.claude/projects/<slug>/memory からの symlink 先）
MEMDIR=.claude/memory

# STATUS_SSOT は宣言しない。
# このワークスペースは「現在地」を持たない運用（単発のサイト改修が積み重なる形で、
# 中断・再開をまたぐ長期プランが無い）。経緯は CHANGELOG.md が時系列で持っている。
# 長期の移行計画などを始めたら、そのときに置き場を決めて宣言する。

# 未反映コミットが何件溜まったら Stop フックが /update-docs end を促すか（既定 5）。
NUDGE_AFTER_COMMITS=5
